<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Data Analyst OS — Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg-page: #000000;
      --bg-card-dark: #141414;
      --border-dark: #2a2a2a;
      --card-offwhite: rgba(247,247,245,0.92);
      --card-lavender: rgba(237,233,247,0.92);
      --card-mint: rgba(224,245,238,0.92);
      --card-rose: rgba(253,234,239,0.92);
      --card-cream: rgba(255,251,235,0.92);
      --accent: #10B981;
      --text-white: #FFFFFF;
      --text-muted: #7A7A7A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-page);
      color: var(--text-white);
      min-height: 100vh;
      padding: 32px;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-dark);
    }

    .header-title {
      font-family: 'Barlow', sans-serif;
      font-size: 28px;
      font-weight: 300;
      color: var(--text-white);
    }

    .header-title span {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 18px;
      color: var(--text-muted);
      margin-left: 12px;
    }

    .header-title span a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .header-title span a:hover {
      color: var(--text-white);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: var(--bg-card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 24px;
      font-size: 13px;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    .status-dot.processing {
      background: #F59E0B;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: 220px 180px minmax(0, 2.2fr);
      gap: 18px;
      min-height: calc(100vh - 140px);
    }

    /* PANELS */
    .panel {
      background: var(--bg-card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-dark);
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header .count {
      color: var(--accent);
      font-weight: 600;
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }

    /* INPUT FILES */
    .upload-zone {
      border: 2px dashed #333;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      margin-bottom: 16px;
      transition: all 0.2s;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }

    .upload-zone:hover {
      border-color: #555;
      background: rgba(255,255,255,0.02);
    }

    .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.05);
    }

    .upload-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 12px;
      background: #222;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #666;
    }

    .upload-text {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .upload-text strong {
      color: var(--text-white);
      display: block;
      margin-bottom: 4px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-dark);
      border-radius: 14px;
      margin-bottom: 10px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, transform 0.2s;
    }

    .file-item:hover {
      border-color: #4a4a4a;
      transform: translateY(-1px);
    }

    .file-icon {
      width: 44px;
      height: 44px;
      background: var(--card-mint);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #0D9488;
      font-weight: 700;
    }

    .file-info h4 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .file-info p {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* PIPELINE */
    .pipeline-stage {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 8px;
      transition: all 0.3s;
      border: 1px solid transparent;
    }

    .pipeline-stage.completed {
      background: rgba(224, 245, 238, 0.12);
      border-color: rgba(13, 148, 136, 0.25);
    }

    .pipeline-stage.processing {
      background: rgba(255, 251, 235, 0.12);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .pipeline-stage.pending {
      background: rgba(255,255,255,0.02);
      opacity: 0.5;
    }

    .stage-indicator {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .completed .stage-indicator {
      background: #E0F5EE;
      color: #0D9488;
    }

    .processing .stage-indicator {
      background: #FEF3C7;
      color: #92610E;
      animation: pulse 1s infinite;
    }

    .pending .stage-indicator {
      background: #222;
      color: #555;
    }

    /* Stage Colors - Filled Cards with Abstract Icons */
    .stage-mint.completed, .stage-mint.pending { background: rgba(224, 245, 238, 0.92); border-color: rgba(13, 148, 136, 0.2); }
    .stage-mint .stage-indicator { background: rgba(0,0,0,0.08); color: #1a1a1a; }
    .stage-mint .stage-info h4 { color: #1a1a1a; }
    .stage-mint .stage-info p { color: #4a4a4a; }
    .stage-mint .stage-time { color: #4a4a4a; }
    
    .stage-lavender.completed, .stage-lavender.pending { background: rgba(237, 233, 247, 0.92); border-color: rgba(124, 92, 191, 0.2); }
    .stage-lavender .stage-indicator { background: rgba(0,0,0,0.08); color: #1a1a1a; }
    .stage-lavender .stage-info h4 { color: #1a1a1a; }
    .stage-lavender .stage-info p { color: #4a4a4a; }
    .stage-lavender .stage-time { color: #4a4a4a; }
    
    .stage-rose.completed, .stage-rose.pending { background: rgba(253, 234, 239, 0.92); border-color: rgba(161, 61, 92, 0.2); }
    .stage-rose .stage-indicator { background: rgba(0,0,0,0.08); color: #1a1a1a; }
    .stage-rose .stage-info h4 { color: #1a1a1a; }
    .stage-rose .stage-info p { color: #4a4a4a; }
    .stage-rose .stage-time { color: #4a4a4a; }
    
    .stage-cream.completed, .stage-cream.pending, .stage-cream.processing { background: rgba(255, 251, 235, 0.92); border-color: rgba(245, 158, 11, 0.2); }
    .stage-cream .stage-indicator { background: rgba(0,0,0,0.08); color: #1a1a1a; }
    .stage-cream .stage-info h4 { color: #1a1a1a; }
    .stage-cream .stage-info p { color: #4a4a4a; }
    .stage-cream .stage-time { color: #4a4a4a; }
    
    .pipeline-stage.pending { opacity: 0.6; }
    .pipeline-stage.pending .stage-indicator { background: rgba(0,0,0,0.05); color: #888; }

    .stage-info {
      flex: 1;
    }

    .stage-info h4 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 2px;
      font-family: 'JetBrains Mono', monospace;
    }

    .stage-info p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stage-time {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* OUTPUTS */
    .output-item {
      background: var(--bg-card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.2s;
      min-height: 140px;
      display: flex;
      flex-direction: column;
    }

    .output-item:hover {
      border-color: #444;
      transform: translateY(-2px);
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      transition: background 0.2s;
      min-height: 72px;
      cursor: pointer;
    }

    .output-header:hover {
      background: rgba(255,255,255,0.02);
    }

    .output-title {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .output-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
    }

    .output-icon.eda { background: #E8E0F5; color: #7C5CBF; }
    .output-icon.metrics { background: #FEF3C7; color: #F59E0B; }
    .output-icon.dashboard { background: #DBEAFE; color: #3B82F6; }
    .output-icon.report { background: #CCFBF1; color: #0D9488; }
    .output-icon.questions { background: #FCE7F3; color: #DB2777; }

    .output-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }

    .output-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.45;
      white-space: normal;
      word-break: break-word;
    }

    .output-preview {
      border-top: 1px solid var(--border-dark);
      background: #0a0a0a;
      display: none;
      flex: 1;
    }

    .output-item.expanded .output-preview {
      display: block;
    }

    .outputs-gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-content: start;
    }

    .output-expand {
      color: #666;
      transition: transform 0.2s;
      font-size: 10px;
      flex-shrink: 0;
    }

    .output-item.expanded .output-expand {
      transform: rotate(180deg);
    }

    .report-card {
      padding: 18px;
    }

    .report-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-dark);
      flex-wrap: wrap;
    }

    .report-header h3 {
      font-family: 'Barlow', sans-serif;
      font-size: 16px;
      font-weight: 500;
    }

    .report-header .badge {
      font-size: 10px;
      padding: 4px 10px;
      background: var(--card-mint);
      color: #0D9488;
      border-radius: 12px;
      font-weight: 600;
    }

    .report-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric-card {
      background: var(--bg-card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .metric-value {
      font-family: 'Barlow', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-white);
      margin-bottom: 4px;
    }

    .metric-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .report-insights {
      background: var(--bg-card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 14px;
    }

    .report-charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .report-chart-card {
      background: var(--bg-card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 10px;
    }

    .report-chart-card img {
      width: 100%;
      height: 96px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      margin-bottom: 8px;
      border: 1px solid #222;
    }

    .report-chart-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 4px;
    }

    .report-chart-caption {
      font-size: 10px;
      line-height: 1.4;
      color: var(--text-muted);
    }

    .report-insights h4 {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .insight-item {
      display: flex;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #222;
      font-size: 12px;
      color: #ccc;
      line-height: 1.5;
    }

    .insight-item:last-child {
      border-bottom: none;
    }

    .insight-number {
      width: 20px;
      height: 20px;
      background: #222;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #888;
      flex-shrink: 0;
    }

    .insight-highlight {
      color: var(--accent);
      font-weight: 500;
    }

    .insight-warning {
      color: #F59E0B;
      font-weight: 500;
    }

    /* JSON Preview */
    .json-preview {
      padding: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #888;
      line-height: 1.7;
    }

    .json-preview pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .section-preview {
      padding: 16px;
    }

    .section-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-item {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-dark);
      background: rgba(255,255,255,0.03);
    }

    .section-item h4 {
      font-size: 11px;
      color: var(--text-white);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section-item p {
      font-size: 12px;
      line-height: 1.6;
      color: #d0d0d0;
    }

    .json-key { color: #7C5CBF; }
    .json-string { color: #10B981; }
    .json-number { color: #F59E0B; }

    /* Questions Preview */
    .questions-list {
      padding: 16px;
    }

    .question-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: var(--bg-card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .question-number {
      width: 28px;
      height: 28px;
      background: var(--card-rose);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #A13D5C;
      flex-shrink: 0;
    }

    .question-text {
      font-size: 13px;
      color: #ccc;
      line-height: 1.5;
    }

    .action-plan-preview {
      padding: 16px;
    }

    .action-plan-title {
      font-family: 'Barlow', sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: var(--text-white);
      margin-bottom: 8px;
    }

    .action-plan-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .action-cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-dark);
      border-radius: 14px;
      padding: 12px;
    }

    .action-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .action-priority {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #0D9488;
      text-transform: uppercase;
    }

    .action-owner {
      font-size: 11px;
      color: var(--text-muted);
    }

    .action-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-white);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .action-meta {
      font-size: 11px;
      color: #9dd8c7;
      margin-bottom: 8px;
    }

    .action-reason {
      font-size: 12px;
      color: #d4d4d4;
      line-height: 1.6;
    }

    .empty-state {
      padding: 24px;
      border: 1px dashed #333;
      border-radius: 16px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    .panel-note {
      margin-bottom: 16px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .path-link {
      color: #9dd8c7;
      text-decoration: none;
    }

    .path-link:hover {
      color: var(--text-white);
    }

    .preview-image {
      padding: 14px;
    }

    .preview-image img {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--border-dark);
      display: block;
      margin-bottom: 10px;
    }

    .preview-caption {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .knowledge-card {
      margin-top: 14px;
      padding: 18px 16px;
      background: rgba(253, 238, 232, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      color: #333;
    }

    .knowledge-icon {
      width: 44px;
      height: 44px;
      background: rgba(219, 39, 119, 0.12);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      color: #db2777;
      font-size: 20px;
    }

    .knowledge-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .knowledge-subtitle {
      font-size: 12px;
      line-height: 1.6;
      color: #666;
      margin-bottom: 14px;
    }

    .knowledge-badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      color: #db2777;
      background: rgba(219, 39, 119, 0.12);
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .knowledge-section {
      margin-top: 12px;
    }

    .knowledge-section h4 {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 10px;
    }

    .knowledge-memory,
    .knowledge-rule {
      padding: 10px 0;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
    }

    .knowledge-memory:first-of-type,
    .knowledge-rule:first-of-type {
      border-top: none;
      padding-top: 0;
    }

    .knowledge-memory-title {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .knowledge-memory-detail,
    .knowledge-rule {
      font-size: 12px;
      line-height: 1.6;
      color: #555;
    }

    @media (max-width: 1280px) {
      .grid {
        grid-template-columns: 200px 170px minmax(0, 1fr);
      }

      .outputs-gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .report-charts {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: 1fr;
        height: auto;
      }

      .outputs-gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<header class="header">
  <h1 class="header-title">AI Data Analyst OS <span>by <a href="https://www.linkedin.com/in/seoyeonjun/" target="_blank">Seoyeon Jun</a></span></h1>
  <div class="status-badge">
    <div class="status-dot processing" id="statusDot"></div>
    <span id="statusText">Loading latest run</span>
  </div>
</header>

<div class="grid">
  <!-- INPUT PANEL -->
  <div class="panel">
    <div class="panel-header">
      <span>Input Data</span>
      <span class="count" id="inputCount">0 files</span>
    </div>
    <div class="panel-content">
      <a class="upload-zone" href="file:///Users/shanny/Codex/Script/agent-map/data/inbox">
        <div class="upload-icon">↑</div>
        <div class="upload-text">
          <strong>Put files in `agent-map/data/inbox/`</strong>
          Then run `python3 agent-map/pipeline/run_da_flow.py`<br>
          <span class="path-link">Open folder in Finder</span>
        </div>
      </a>
      <div class="panel-note" id="runMeta">Waiting for run metadata.</div>
      <div id="inputFiles"></div>
      <div id="knowledgeBase"></div>
    </div>
  </div>

  <!-- PIPELINE PANEL -->
  <div class="panel">
    <div class="panel-header">
      <span>Pipeline Progress</span>
      <span id="progressText">0 / 7 completed</span>
    </div>
    <div class="panel-content" id="pipelineStages"></div>
  </div>

  <!-- OUTPUTS PANEL -->
  <div class="panel">
    <div class="panel-header">
      <span>Outputs</span>
      <span class="count" id="outputCount">0 ready</span>
    </div>
    <div class="panel-content" id="outputsList"></div>
  </div>
</div>

<script>
const statusUrl = './runs/latest/status.json';
const outputsUrl = './runs/latest/outputs/index.json';
const knowledgeBaseUrl = './runs/latest/outputs/knowledge_base.json';
const inboxFinderUrl = 'file:///Users/shanny/Codex/Script/agent-map/data/inbox';

const state = {
  status: null,
  outputs: [],
  knowledgeBase: null,
};

const iconSymbol = {
  eda: '◇',
  metrics: '□',
  dashboard: '▦',
  report: '≡',
  questions: '?',
};

function formatBytes(bytes) {
  if (!bytes) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB'];
  let value = bytes;
  let unitIndex = 0;
  while (value >= 1024 && unitIndex < units.length - 1) {
    value /= 1024;
    unitIndex += 1;
  }
  return `${value.toFixed(value >= 10 || unitIndex === 0 ? 0 : 1)} ${units[unitIndex]}`;
}

function formatDuration(seconds) {
  if (seconds == null) return '—';
  return `${seconds.toFixed(1)}s`;
}

function formatTimestamp(value) {
  if (!value) return '—';
  const date = new Date(value);
  return date.toLocaleString();
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function renderEmpty(containerId, message) {
  document.getElementById(containerId).innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
}

function renderInputs() {
  const inputs = state.status?.inputs || [];
  document.getElementById('inputCount').textContent = `${inputs.length} file${inputs.length === 1 ? '' : 's'}`;
  const runMeta = document.getElementById('runMeta');

  if (!state.status) {
    runMeta.textContent = 'No run metadata available.';
    renderEmpty('inputFiles', 'Run the pipeline once to populate input metadata.');
    return;
  }

  runMeta.textContent = `Run ${state.status.run_id} · started ${formatTimestamp(state.status.started_at)}`;

  if (!inputs.length) {
    renderEmpty('inputFiles', 'No input files detected in the latest run.');
    return;
  }

  document.getElementById('inputFiles').innerHTML = inputs.map((file) => `
    <a class="file-item" href="${inboxFinderUrl}/${encodeURIComponent(file.name)}">
      <div class="file-icon">${escapeHtml((file.type || 'file').slice(0, 3).toUpperCase())}</div>
      <div class="file-info">
        <h4>${escapeHtml(file.name)}</h4>
        <p>${formatBytes(file.size_bytes)} · ${file.rows || 0} rows · ${file.columns || 0} columns · Open in Finder</p>
      </div>
    </a>
  `).join('');
}

function renderKnowledgeBase() {
  if (!state.knowledgeBase) {
    document.getElementById('knowledgeBase').innerHTML = '';
    return;
  }

  const memories = (state.knowledgeBase.memories || []).map((memory) => `
    <div class="knowledge-memory">
      <div class="knowledge-memory-title">${escapeHtml(memory.title)}</div>
      <div class="knowledge-memory-detail">${escapeHtml(memory.detail)}</div>
    </div>
  `).join('');

  const rules = (state.knowledgeBase.rules || []).map((rule) => `
    <div class="knowledge-rule">${escapeHtml(rule)}</div>
  `).join('');

  document.getElementById('knowledgeBase').innerHTML = `
    <div class="knowledge-card">
      <div class="knowledge-icon">✳</div>
      <div class="knowledge-title">${escapeHtml(state.knowledgeBase.title || 'Knowledge Base')}</div>
      <div class="knowledge-subtitle">${escapeHtml(state.knowledgeBase.subtitle || '')}</div>
      <div class="knowledge-badge">${escapeHtml(state.knowledgeBase.badge || 'Active')}</div>
      <div class="knowledge-section">
        <h4>Latest Memory</h4>
        ${memories}
      </div>
      <div class="knowledge-section">
        <h4>Operating Rules</h4>
        ${rules}
      </div>
    </div>
  `;
}

function renderStages() {
  const stages = state.status?.stages || [];
  const progress = state.status?.progress || { completed: 0, total: 7 };
  document.getElementById('progressText').textContent = `${progress.completed} / ${progress.total} completed`;

  if (!stages.length) {
    renderEmpty('pipelineStages', 'No stage data available yet.');
    return;
  }

  document.getElementById('pipelineStages').innerHTML = stages.map((stage) => `
    <div class="pipeline-stage ${escapeHtml(stage.status)} stage-${escapeHtml(stage.color)}">
      <div class="stage-indicator">${escapeHtml(stage.icon)}</div>
      <div class="stage-info">
        <h4>${escapeHtml(stage.name)}</h4>
        <p>${escapeHtml(stage.summary || 'Pending')}</p>
      </div>
      <div class="stage-time">${formatDuration(stage.duration_seconds)}</div>
    </div>
  `).join('');
}

function renderReportPreview(preview) {
  const metrics = (preview.metrics || []).map((metric) => `
    <div class="metric-card">
      <div class="metric-value">${escapeHtml(metric.value)}</div>
      <div class="metric-label">${escapeHtml(metric.label)}</div>
    </div>
  `).join('');

  const insights = (preview.insights || []).map((insight, index) => `
    <div class="insight-item">
      <div class="insight-number">${index + 1}</div>
      <div>${escapeHtml(insight)}</div>
    </div>
  `).join('');

  const charts = (preview.charts || []).map((chart) => `
    <div class="report-chart-card">
      <img src="./${escapeHtml(chart.image_path)}" alt="${escapeHtml(chart.title)}">
      <div class="report-chart-title">${escapeHtml(chart.title)}</div>
      <div class="report-chart-caption">${escapeHtml(chart.caption || '')}</div>
    </div>
  `).join('');

  return `
    <div class="report-card">
      <div class="report-header">
        <h3>${escapeHtml(preview.title || 'Report')}</h3>
        <span class="badge">${escapeHtml(preview.badge || 'Ready')}</span>
      </div>
      <div class="report-metrics">${metrics}</div>
      <div class="report-insights">
        <h4>Key Insights</h4>
        ${insights}
      </div>
      ${charts ? `<div class="report-charts">${charts}</div>` : ''}
    </div>
  `;
}

function renderSectionPreview(preview) {
  const metrics = (preview.metrics || []).length ? (preview.metrics || []).map((metric) => `
    <div class="metric-card">
      <div class="metric-value">${escapeHtml(metric.value)}</div>
      <div class="metric-label">${escapeHtml(metric.label)}</div>
    </div>
  `).join('') : '';

  const sections = (preview.sections || []).map((section) => `
    <div class="section-item">
      <h4>${escapeHtml(section.heading)}</h4>
      <p>${escapeHtml(section.body)}</p>
    </div>
  `).join('');

  return `
    <div class="section-preview">
      <div class="report-header">
        <h3>${escapeHtml(preview.title || 'Summary')}</h3>
        <span class="badge">${escapeHtml(preview.badge || 'Ready')}</span>
      </div>
      ${metrics ? `<div class="report-metrics">${metrics}</div>` : ''}
      <div class="section-list">${sections}</div>
    </div>
  `;
}

function renderQuestionsPreview(preview) {
  return `
    <div class="questions-list">
      ${(preview.questions || []).map((question, index) => `
        <div class="question-item">
          <div class="question-number">${index + 1}</div>
          <div class="question-text">${escapeHtml(question)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderActionPlanPreview(preview) {
  return `
    <div class="action-plan-preview">
      <div class="action-plan-title">Action Plan</div>
      <div class="action-plan-subtitle">Prioritized next steps based on the latest DA flow run.</div>
      <div class="action-cards">
        ${(preview.actions || []).map((action) => `
          <div class="action-card">
            <div class="action-card-header">
              <div class="action-priority">P${escapeHtml(action.priority)}</div>
              <div class="action-owner">${escapeHtml(action.owner)}</div>
            </div>
            <div class="action-title">${escapeHtml(action.title)}</div>
            <div class="action-meta">Impact: ${escapeHtml(action.impact)}</div>
            <div class="action-reason">${escapeHtml(action.reason)}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderImagePreview(preview) {
  return `
    <div class="preview-image">
      <img src="./${escapeHtml(preview.image_path)}" alt="${escapeHtml(preview.title || 'Chart preview')}">
      <div class="preview-caption">${escapeHtml(preview.caption || '')}</div>
    </div>
  `;
}

function previewHtml(output) {
  const preview = output.preview || {};
  if (preview.kind === 'eda-report') return renderReportPreview(preview);
  if (preview.kind === 'report') return renderReportPreview(preview);
  if (preview.kind === 'sections') return renderSectionPreview(preview);
  if (preview.kind === 'questions') return renderQuestionsPreview(preview);
  if (preview.kind === 'action-plan') return renderActionPlanPreview(preview);
  return `<div class="empty-state">No preview available for ${escapeHtml(output.name)}.</div>`;
}

function renderOutputs() {
  document.getElementById('outputCount').textContent = `${state.outputs.length} ready`;
  if (!state.outputs.length) {
    renderEmpty('outputsList', 'Pipeline outputs will appear here after a successful run.');
    return;
  }

  document.getElementById('outputsList').innerHTML = `<div class="outputs-gallery">${state.outputs.map((output) => `
    <div class="output-item expanded">
      <div class="output-header" onclick="this.parentElement.classList.toggle('expanded')">
        <div class="output-title">
          <div class="output-icon ${escapeHtml(output.icon_class || 'report')}">${iconSymbol[output.icon_class] || '•'}</div>
          <div>
            <div class="output-name">${escapeHtml(output.name)}</div>
            <div class="output-meta">${escapeHtml(output.file_name)} · ${escapeHtml(output.meta || '')}</div>
          </div>
        </div>
        <div class="output-expand">▼</div>
      </div>
      <div class="output-preview">${previewHtml(output)}</div>
    </div>
  `).join('')}</div>`;
}

function renderHeader() {
  const statusText = document.getElementById('statusText');
  const statusDot = document.getElementById('statusDot');
  if (!state.status) {
    statusText.textContent = 'No latest run found';
    statusDot.classList.remove('processing');
    return;
  }
  const currentStage = state.status.current_stage === 'done' ? 'completed' : state.status.current_stage;
  statusText.textContent = `${state.status.overall_status} @${currentStage} · run ${state.status.run_id}`;
  if (state.status.overall_status === 'completed') {
    statusDot.classList.remove('processing');
  } else {
    statusDot.classList.add('processing');
  }
}

async function loadDashboard() {
  try {
    const [statusResponse, outputsResponse, knowledgeResponse] = await Promise.all([
      fetch(statusUrl, { cache: 'no-store' }),
      fetch(outputsUrl, { cache: 'no-store' }),
      fetch(knowledgeBaseUrl, { cache: 'no-store' }),
    ]);
    if (!statusResponse.ok) throw new Error('status.json not found');
    state.status = await statusResponse.json();
    state.outputs = outputsResponse.ok ? (await outputsResponse.json()).outputs || [] : [];
    state.knowledgeBase = knowledgeResponse.ok ? await knowledgeResponse.json() : null;
  } catch (error) {
    console.error(error);
    state.status = null;
    state.outputs = [];
    state.knowledgeBase = null;
  }

  renderHeader();
  renderInputs();
  renderKnowledgeBase();
  renderStages();
  renderOutputs();
}

loadDashboard();
setInterval(loadDashboard, 10000);
</script>

</body>
</html>
