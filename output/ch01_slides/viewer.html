<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CH01 슬라이드 뷰어 — Claude Code 강의</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --orange: #E8734A;
    --orange-dark: #C84A28;
    --bg: #F5F0E8;
    --card: #FFFFFF;
    --border: #E0D4C2;
    --text: #1A1A1A;
    --dim: #888070;
    --sidebar-w: 280px;
  }

  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── 사이드바 ── */
  aside {
    width: var(--sidebar-w);
    background: #1C1814;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 24px 20px 20px;
    border-bottom: 1px solid #2E2620;
  }
  .sidebar-header .chapter-badge {
    display: inline-block;
    background: var(--orange);
    color: white;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 8px;
  }
  .sidebar-header h1 { font-size: 15px; color: #F0EAE0; font-weight: 600; line-height: 1.4; }
  .sidebar-header p  { font-size: 12px; color: #7A6E62; margin-top: 4px; }

  .slide-list { padding: 12px 0; flex: 1; }

  .slide-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .slide-item:hover  { background: #2A2218; }
  .slide-item.active { background: #2A2218; border-left-color: var(--orange); }

  .slide-thumb {
    width: 72px;
    height: 40px;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid #3A3028;
    flex-shrink: 0;
  }
  .slide-item.active .slide-thumb { border-color: var(--orange); }

  .slide-meta { flex: 1; min-width: 0; }
  .slide-num  { font-size: 11px; color: var(--orange); font-weight: 700; }
  .slide-title{ font-size: 12px; color: #CCC0B0; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── 메인 뷰어 ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 툴바 */
  .toolbar {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .toolbar .slide-info { flex: 1; }
  .toolbar .clip-id    { font-size: 13px; font-weight: 700; color: var(--orange); }
  .toolbar .clip-name  { font-size: 14px; font-weight: 600; color: var(--text); margin-left: 10px; }

  .nav-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--text);
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .nav-btn:hover { background: var(--orange); color: white; border-color: var(--orange); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn:disabled:hover { background: var(--card); color: var(--text); border-color: var(--border); }

  .page-indicator {
    font-size: 13px; color: var(--dim);
    padding: 0 4px; white-space: nowrap;
  }

  /* 슬라이드 뷰 */
  .slide-view {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    background: #EDE8E0;
  }

  .slide-view img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    cursor: pointer;
  }

  /* 썸네일 스트립 */
  .strip {
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
  }
  .strip::-webkit-scrollbar { height: 4px; }
  .strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .strip-item {
    flex-shrink: 0;
    cursor: pointer;
    border-radius: 6px;
    overflow: hidden;
    border: 2px solid transparent;
    transition: all 0.15s;
    position: relative;
  }
  .strip-item:hover { border-color: var(--orange); transform: translateY(-2px); }
  .strip-item.active { border-color: var(--orange); }
  .strip-item img { width: 120px; height: 68px; object-fit: cover; display: block; }
  .strip-item .strip-num {
    position: absolute; bottom: 2px; right: 4px;
    font-size: 10px; font-weight: 700;
    color: white; background: rgba(0,0,0,0.5);
    padding: 1px 5px; border-radius: 3px;
  }

  /* 라이트박스 */
  .lightbox {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 1000;
    align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 95vw; max-height: 95vh; border-radius: 8px; }
  .lightbox-close {
    position: absolute; top: 20px; right: 24px;
    color: white; font-size: 32px; cursor: pointer; opacity: 0.7;
    transition: opacity 0.15s;
  }
  .lightbox-close:hover { opacity: 1; }

  /* 키보드 힌트 */
  .kbd-hint {
    font-size: 11px; color: var(--dim);
    display: flex; gap: 12px; align-items: center;
  }
  .kbd { background: #F0EAE0; border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 11px; }
</style>
</head>
<body>

<!-- 사이드바 -->
<aside>
  <div class="sidebar-header">
    <span class="chapter-badge">CH01</span>
    <h1>클로드 코드 첫 걸음</h1>
    <p>슬라이드 7장 · 샘플</p>
  </div>
  <div class="slide-list" id="slideList"></div>
</aside>

<!-- 메인 -->
<main>
  <div class="toolbar">
    <div class="slide-info">
      <span class="clip-id" id="clipId">CH01-01</span>
      <span class="clip-name" id="clipName">클로드 코드란 무엇인가</span>
    </div>
    <div class="kbd-hint">
      <span><span class="kbd">←</span><span class="kbd">→</span> 이동</span>
      <span><span class="kbd">F</span> 전체화면</span>
    </div>
    <button class="nav-btn" id="btnPrev" onclick="go(-1)">&#8592;</button>
    <span class="page-indicator" id="pageInd">1 / 7</span>
    <button class="nav-btn" id="btnNext" onclick="go(1)">&#8594;</button>
  </div>

  <div class="slide-view">
    <img id="mainImg" src="" alt="슬라이드" onclick="openLightbox()" />
  </div>

  <div class="strip" id="strip"></div>
</main>

<!-- 라이트박스 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">&#10005;</span>
  <img id="lbImg" src="" alt="" />
</div>

<script>
const slides = [
  { file:"01_title.png",      clipId:"CH01",    name:"챕터 개요" },
  { file:"02_comparison.png", clipId:"CH01-01", name:"두 가지 도구의 차이" },
  { file:"03_agent_loop.png", clipId:"CH01-01", name:"에이전트 구조" },
  { file:"04_install.png",    clipId:"CH01-02", name:"설치 & 첫 번째 세션" },
  { file:"05_claude_md.png",  clipId:"CH01-03", name:"CLAUDE.md 개요" },
  { file:"06_commands.png",   clipId:"CH01-06", name:"슬래시 커맨드 정리" },
  { file:"07_cost.png",       clipId:"CH01-07", name:"토큰 절약·비용 관리" },
];

let cur = 0;

function render() {
  const s = slides[cur];
  document.getElementById("mainImg").src  = s.file;
  document.getElementById("clipId").textContent   = s.clipId;
  document.getElementById("clipName").textContent = s.name;
  document.getElementById("pageInd").textContent  = `${cur+1} / ${slides.length}`;
  document.getElementById("btnPrev").disabled = cur === 0;
  document.getElementById("btnNext").disabled = cur === slides.length-1;

  document.querySelectorAll(".slide-item").forEach((el,i) => {
    el.classList.toggle("active", i===cur);
    if(i===cur) el.scrollIntoView({block:"nearest"});
  });
  document.querySelectorAll(".strip-item").forEach((el,i) => {
    el.classList.toggle("active", i===cur);
    if(i===cur) el.scrollIntoView({inline:"nearest", behavior:"smooth"});
  });
}

function go(dir) {
  cur = Math.max(0, Math.min(slides.length-1, cur+dir));
  render();
}

function jumpTo(i) { cur=i; render(); }

function openLightbox() {
  document.getElementById("lbImg").src = slides[cur].file;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
}

// 사이드바 리스트
const list = document.getElementById("slideList");
slides.forEach((s,i) => {
  const el = document.createElement("div");
  el.className = "slide-item";
  el.innerHTML = `
    <img class="slide-thumb" src="${s.file}" alt="">
    <div class="slide-meta">
      <div class="slide-num">${s.clipId}</div>
      <div class="slide-title">${s.name}</div>
    </div>`;
  el.onclick = () => jumpTo(i);
  list.appendChild(el);
});

// 썸네일 스트립
const strip = document.getElementById("strip");
slides.forEach((s,i) => {
  const el = document.createElement("div");
  el.className = "strip-item";
  el.innerHTML = `<img src="${s.file}" alt=""><span class="strip-num">${i+1}</span>`;
  el.onclick = () => jumpTo(i);
  strip.appendChild(el);
});

// 키보드
document.addEventListener("keydown", e => {
  if(e.key==="ArrowLeft")  go(-1);
  if(e.key==="ArrowRight") go(1);
  if(e.key==="f"||e.key==="F") openLightbox();
  if(e.key==="Escape") closeLightbox();
});

render();
</script>
</body>
</html>
