<!DOCTYPE html><html lang=ko><head><meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>P05 강의자료 — 스크립트 뷰어</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{box-sizing:border-box;margin:0}body{font-family:'Pretendard',-apple-system,sans-serif;background:#F2F2EF;color:#1C1A18;display:flex;height:100vh;overflow:hidden}
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
#side{width:340px;flex-shrink:0;background:#fff;border-right:1px solid #D8D5D0;overflow-y:auto;padding:18px 16px}
#side h1{font-size:17px;margin-bottom:4px}#side .sub{font-size:12px;color:#888;margin-bottom:16px}
.ch{margin-bottom:14px}.ch>.t{font-size:14px;font-weight:700;color:#E8603C;margin-bottom:6px}
.deck-link{display:block;font-size:12.5px;color:#4A7AB5;text-decoration:none;margin:0 0 4px 2px}
.s{display:block;width:100%;text-align:left;background:#F7F6F4;border:1px solid #E3E0DB;border-radius:6px;padding:8px 11px;font-size:12.5px;margin-bottom:5px;cursor:pointer;line-height:1.4}
.s:hover{background:#efe;border-color:#6aac98}.s.on{background:#E8603C;color:#fff;border-color:#E8603C}
#main{flex:1;overflow-y:auto;padding:40px 56px}#main .md{max-width:820px;line-height:1.75;font-size:15.5px}
#main h2{font-size:22px;margin:26px 0 10px;padding-top:14px;border-top:1px solid #E3E0DB}
#main h2:first-child{border:0;padding:0;margin-top:0}#main strong{color:#E8603C}
#main blockquote{background:#fff;border-left:3px solid #6aac98;padding:12px 18px;margin:14px 0;border-radius:0 6px 6px 0}
#main code{background:#0A0C10;color:#9fd;padding:1px 6px;border-radius:4px;font-size:13px}
#main pre{background:#0A0C10;color:#cde;padding:14px 18px;border-radius:8px;overflow-x:auto}#main pre code{background:0;padding:0}
#hint{color:#888;font-size:14px;margin-top:40px}
</style></head><body>
<div id=side><h1>P05 강의자료</h1><div class=sub>슬라이드·스크립트 · 라이브 최신본</div><div id=nav></div></div>
<div id=main><div class=md id=view><p id=hint>← 왼쪽에서 클립 스크립트를 누르면 여기에 렌더됩니다. 슬라이드 링크는 새 탭에서 열립니다.</p></div></div>
<script>
const D=[{"dir": "P05-CH00", "label": "Intro · 공통 이론", "deck": "P05-CH00/P05-CH00-공통이론-slides.html", "scripts": [{"name": "P05-CH00 Intro — 데이터 분석 & 시각화 공통 이론", "path": "P05-CH00/P05-CH00 Intro — 데이터 분석 & 시각화 공통 이론.md"}]}, {"dir": "P05-CH01", "label": "CH01 · 마케팅 캠페인", "deck": "P05-CH01/P05-CH01-slides.html", "scripts": [{"name": "P05-CH01-01 캠페인 성과 대시보드 기획안 (채널별 성과 & 시계열 예측 & 클러스터 분석)", "path": "P05-CH01/P05-CH01-01 캠페인 성과 대시보드 기획안 (채널별 성과 & 시계열 예측 & 클러스터 분석).md"}, {"name": "P05-CH01-02 캠페인 성과 대시보드 전용 CLAUDE + Skill로 제작 실습", "path": "P05-CH01/P05-CH01-02 캠페인 성과 대시보드 전용 CLAUDE.md + Skill로 제작 실습.md"}, {"name": "P05-CH01-03 캠페인 성과 대시보드 활용 방법과 인사이트 도출", "path": "P05-CH01/P05-CH01-03 캠페인 성과 대시보드 활용 방법과 인사이트 도출.md"}]}, {"dir": "P05-CH02", "label": "CH02 · A/B 테스트", "deck": "P05-CH02/P05-CH02-slides.html", "scripts": [{"name": "P05-CH02-01 A-B test 대시보드 기획안", "path": "P05-CH02/P05-CH02-01 A-B test 대시보드 기획안.md"}, {"name": "P05-CH02-02 A-B test 대시보드 전용 CLAUDE + Skill로 제작 실습", "path": "P05-CH02/P05-CH02-02 A-B test 대시보드 전용 CLAUDE.md + Skill로 제작 실습.md"}, {"name": "P05-CH02-03 A-B test 대시보드 활용 방법과 인사이트 도출", "path": "P05-CH02/P05-CH02-03 A-B test 대시보드 활용 방법과 인사이트 도출.md"}]}, {"dir": "P05-CH03", "label": "CH03 · PM 지표", "deck": "P05-CH03/P05-CH03-slides.html", "scripts": [{"name": "P05-CH03-01 PM 대시보드 기획안 (Metric Hierarchy & 원인 분석 & Action)", "path": "P05-CH03/P05-CH03-01 PM 대시보드 기획안 (Metric Hierarchy & 원인 분석 & Action).md"}, {"name": "P05-CH03-02 PM 대시보드 전용 CLAUDE + Skill로 제작 실습", "path": "P05-CH03/P05-CH03-02 PM 대시보드 전용 CLAUDE.md + Skill로 제작 실습.md"}, {"name": "P05-CH03-03 PM 대시보드 활용 방법과 인사이트 도출", "path": "P05-CH03/P05-CH03-03 PM 대시보드 활용 방법과 인사이트 도출.md"}]}, {"dir": "P05-CH04", "label": "CH04 · 리텐션", "deck": "P05-CH04/P05-CH04-slides.html", "scripts": [{"name": "P05-CH04-01 리텐션 분석 대시보드 기획안 (코호트 & What-if & LTV)", "path": "P05-CH04/P05-CH04-01 리텐션 분석 대시보드 기획안 (코호트 & What-if & LTV).md"}, {"name": "P05-CH04-02 리텐션 대시보드 전용 CLAUDE + Skill로 제작 실습", "path": "P05-CH04/P05-CH04-02 리텐션 대시보드 전용 CLAUDE.md + Skill로 제작 실습.md"}, {"name": "P05-CH04-03 리텐션 대시보드 활용 방법과 인사이트 도출", "path": "P05-CH04/P05-CH04-03 리텐션 대시보드 활용 방법과 인사이트 도출.md"}]}, {"dir": "P05-CH05", "label": "CH05 · HR 채용", "deck": "P05-CH05/P05-CH05-slides.html", "scripts": [{"name": "P05-CH05-01 HR 대시보드 기획안 (채용 퍼널)", "path": "P05-CH05/P05-CH05-01 HR 대시보드 기획안 (채용 퍼널).md"}, {"name": "P05-CH05-02 HR 대시보드 전용 CLAUDE + Skill로 제작 실습", "path": "P05-CH05/P05-CH05-02 HR 대시보드 전용 CLAUDE.md + Skill로 제작 실습.md"}, {"name": "P05-CH05-03 HR 대시보드 활용 방법과 인사이트 도출", "path": "P05-CH05/P05-CH05-03 HR 대시보드 활용 방법과 인사이트 도출.md"}]}];
const nav=document.getElementById('nav'), view=document.getElementById('view');
D.forEach(ch=>{const w=document.createElement('div');w.className='ch';
 let h='<div class=t>'+ch.label+'</div>';
 if(ch.deck)h+='<a class=deck-link target=_blank href="'+encodeURI(ch.deck)+'">🖥 슬라이드 열기 →</a>';
 ch.scripts.forEach(s=>{h+='<button class=s data-p="'+encodeURI(s.path)+'">📄 '+s.name+'</button>';});
 w.innerHTML=h;nav.appendChild(w);});
nav.addEventListener('click',async e=>{const b=e.target.closest('.s');if(!b)return;
 document.querySelectorAll('.s').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 view.innerHTML='<p id=hint>불러오는 중…</p>';
 try{const r=await fetch(b.dataset.p);const t=await r.text();view.innerHTML=marked.parse(t);}
 catch(err){view.innerHTML='<p>불러오기 실패: '+err+'</p>';}
 document.getElementById('main').scrollTop=0;});
</script></body></html>
